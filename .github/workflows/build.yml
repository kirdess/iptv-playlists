name: Build playlists
on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch:        # "Run workflow" button
  push:
    paths: ["build.py", "custom/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rm -rf out && python build.py
      - name: Commit playlists
        run: |
          git config user.name "playlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out
          git diff --cached --quiet || git commit -m "Update playlists $(date -u +%F)"
          git push

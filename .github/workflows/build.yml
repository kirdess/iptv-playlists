name: Build playlists
on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch:        # "Run workflow" button
  push:
    paths: ["build.py", "epg.py", "custom/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: rm -rf out/*.md out/*.m3u out/fra out/sports out/custom && python build.py
      - name: Commit playlists
        run: |
          git config user.name "playlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out
          git diff --cached --quiet || git commit -m "Update playlists $(date -u +%F)"
          git push
      - name: Publish the guide on the epg branch (one commit, replaced every day)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -s out/epg/guide.xml.gz || { echo "::warning::No guide built, keeping the previous one"; exit 0; }
          tmp=$(mktemp -d)
          cp out/epg/guide.xml.gz "$tmp/"
          cd "$tmp"
          git init -q -b epg
          git add guide.xml.gz
          git -c user.name="playlist-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Guide $(date -u +%F)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" epg
